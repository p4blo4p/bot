name: 🔍 URLWatch Monitoring - Detailed Tracking

on:
  schedule:
    # Ejecutar cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permitir ejecución manual

# Permisos explícitos para que el bot pueda hacer git push
permissions:
  contents: write

env:
  TZ: Europe/Madrid

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      run: |
        pip install urlwatch PyYAML

    - name: 📁 Create directories
      run: |
        mkdir -p logs .urlwatch

    - name: 🔄 Extract jobs from urls2watch.yaml
      run: |
        python extract_jobs.py

    - name: 🗂️ Load previous cache if exists
      run: |
        if [ -f "cache.db" ]; then
          cp cache.db .urlwatch/cache.db
          echo "✅ Cache anterior restaurado"
        else
          echo "ℹ️ No hay cache anterior, iniciando sesión limpia"
        fi

    - name: 🔍 Run URLWatch monitoring
      run: |
        echo "🚀 Iniciando monitoreo URLWatch..."
        urlwatch --config .urlwatch/config.yaml --urls .urlwatch/urls.yaml --cache .urlwatch/cache.db --verbose > logs/last_run.log 2>&1 || true
        echo "✅ Monitoreo completado"

    - name: 📈 Analyze changes and generate detailed report
      run: |
        python track_changes.py

    - name: 📦 Upload reports as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: urlwatch-reports-${{ github.run_number }}
        path: |
          logs/*.md
          logs/*.txt
          logs/*.log
        retention-days: 30

    - name: 💾 Backup cache for next run
      run: |
        if [ -f ".urlwatch/cache.db" ]; then
          cp .urlwatch/cache.db cache.db
          echo "✅ Cache guardado para próxima ejecución"
        fi

    - name: 🗂️ Clean old log files
      run: |
        cd logs || exit 0
        ls -t *.txt *.log 2>/dev/null | tail -n +11 | xargs -r rm -- || true

    - name: 📤 Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # -f para forzar en caso de que logs/ este en .gitignore
        git add -f logs/summary.md cache.db || true

        if git diff --staged --quiet; then
          echo "ℹ️ No hay cambios para commitear"
        else
          TIMESTAMP=$(date '+%Y%m%d_%H%M%S')
          git commit -m "🔍 Monitoreo URLWatch - ${TIMESTAMP}" || true
          git push || true
          echo "✅ Cambios subidos correctamente al repositorio"
        fi
